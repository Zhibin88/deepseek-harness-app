# =============================================================================
# DeepSeek Harness 桌面端（Pake/Tauri 壳）三平台自动打包 + GitHub Release
#
# 触发方式：
#   1) 推送 tag（v1.0.0 等）→ 自动构建并发布到 Releases（别人可直接下载）
#   2) 手动触发 Actions 页面的 workflow_dispatch（Debug/预发布）
#
# 产物：
#   macOS  -> DeepSeekHarness.dmg          （universal 双架构：Intel x86_64 + Apple Silicon arm64）
#   Windows-> DeepSeekHarness_x64.msi + DeepSeekHarness_arm64.msi（ARM 版为尽力而为）
#   Linux  -> .deb + .AppImage（+ .rpm，可通过 input 调整）
# =============================================================================
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      url:
        description: "要打包的地址（默认本机 dsh web）"
        required: false
        default: "http://127.0.0.1:3080/"
      app_version:
        description: "版本号（如 1.1.0；留空则取 tag 版本）"
        required: false
      linux_targets:
        description: "Linux 包格式（逗号分隔: deb,appimage,rpm）"
        required: false
        default: "deb,appimage"
      multi_arch:
        description: "macOS 打包 universal 双架构（构建更慢但一份通吃）"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "发布为预发布版"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# GITHUB_TOKEN 需要写权限才能创建 Release
permissions:
  contents: write

env:
  APP_NAME: DeepSeekHarness        # 应用名（Linux 包名 pake 会自动小写化，无需担心）
  APP_TITLE: DeepSeek Harness      # 窗口标题
  APP_IDENTIFIER: com.deepseekharness.app
  PAKE_VERSION: "3.15.6"           # 固定 pake 版本，保证可复现（升级请改这里）

jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false             # 一个平台失败不要影响其他平台
      matrix:
        include:
          - build: macos
            os: macos-latest
          - build: windows
            os: windows-latest
          - build: linux
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---- Rust 工具链（Tauri 编译需要）----
      - name: Install Rust (macOS/Linux)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # ---- 系统依赖 ----
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libdbus-1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential curl wget file \
            libxdo-dev libglib2.0-dev libgirepository1.0-dev pkg-config

      - name: Install WiX Toolset (Windows, 生成 .msi 需要)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.11"
          if (-not (Test-Path "$wix\bin\candle.exe")) {
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe" -OutFile "$env:RUNNER_TEMP\wix311.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\wix311.exe" -ArgumentList "/quiet" -Wait
          }
          echo "$wix\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      # ---- 安装 pake-cli：装到工作区 node_modules（而非全局）----
      # pake 3.x 使用自身内置的 Tauri 工程编译（node_modules/pake-cli/src-tauri），
      # 装在工作区内才能让 rust-cache 命中并持久化编译产物：二次构建从 ~20min 降到 2-3min。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-pake-${{ env.PAKE_VERSION }}

      - name: Install pake-cli
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund pake-cli@${{ env.PAKE_VERSION }}

      - name: Patch pake capability (allow http local service to call shell.open)
        shell: bash
        run: node scripts/patch-pake-capability.js

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "node_modules/pake-cli/src-tauri -> target"

      # ---- 解析版本号：input 优先，否则取 tag（v1.0.0 -> 1.0.0），默认 0.1.0 ----
      - name: Prepare env
        shell: bash
        run: |
          V="${{ inputs.app_version }}"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "APP_VERSION=${V:-0.1.0}" >> "$GITHUB_ENV"
          echo "APP_URL=${{ inputs.url || 'http://127.0.0.1:3080/' }}" >> "$GITHUB_ENV"
          echo "LINUX_TARGETS=${{ inputs.linux_targets || 'deb,appimage' }}" >> "$GITHUB_ENV"
          echo "MULTI_ARCH=${{ inputs.multi_arch || 'true' }}" >> "$GITHUB_ENV"

      # ---- 可选：macOS 签名 + 公证 ----
      # tauri-bundler 原生读取 APPLE_* 环境变量（APPLE_CERTIFICATE 为 base64 的 .p12 +
      # APPLE_CERTIFICATE_PASSWORD 实现签名；APPLE_ID/PASSWORD/TEAM_ID 实现公证+stapling），
      # 无需修改任何配置文件。不配置 secrets 则跳过：产物为 ad-hoc 签名，
      # 用户首次打开时需右键 -> 打开（或 xattr -cr），这是分发前强烈建议补上的。
      - name: Configure macOS signing env
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
        run: |
          # secrets 只在脚本内判断可用性（step 级 if: 不允许访问 secrets context）
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::notice::未配置 MACOS_CERT_P12，跳过签名（产物为 ad-hoc 签名）"
            exit 0
          fi
          echo "APPLE_CERTIFICATE=$MACOS_CERT_P12" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERT_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARIZE_APPLE_ID" ] && [ -n "$MACOS_NOTARIZE_PASSWORD" ]; then
            echo "APPLE_ID=$MACOS_NOTARIZE_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$MACOS_NOTARIZE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$MACOS_NOTARIZE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      # ================= 打包（URL 写死在应用配置里，构建时不要求目标可达） =================
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          ARGS=("$APP_URL" --name "$APP_NAME" --title "$APP_TITLE" \
                --identifier "$APP_IDENTIFIER" --icon assets/icon.png \
                --width 1280 --height 800 --app-version "$APP_VERSION" \
                --inject scripts/external-links.js,scripts/check-update.js,scripts/auth-token.js)
          if [ "$MULTI_ARCH" = "true" ]; then ARGS+=(--multi-arch); fi
          npx --no-install pake "${ARGS[@]}"

      - name: Build Windows (x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 注意：不要用 $args 变量名（PowerShell 只读自动变量，赋值会静默失败导致参数为空）
          New-Item -ItemType Directory -Force dist | Out-Null
          & npx --no-install pake "$env:APP_URL" --name "$env:APP_NAME" --title "$env:APP_TITLE" `
            --identifier "$env:APP_IDENTIFIER" --icon "assets/icon.png" `
            --width 1280 --height 800 --app-version "$env:APP_VERSION" --targets x64 `
            --inject "scripts/external-links.js,scripts/check-update.js,scripts/auth-token.js"
          # pake 会把安装包复制到工作区根目录；马上改名移进 dist，避免被下一次构建覆盖
          if (Test-Path "$env:APP_NAME.msi") { Move-Item "$env:APP_NAME.msi" "dist/${env:APP_NAME}_x64.msi" -Force }

      - name: Build Windows (arm64)  # 尽力而为：若 runner 缺少 ARM64 工具链则跳过，不影响其余产物
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & npx --no-install pake "$env:APP_URL" --name "$env:APP_NAME" --title "$env:APP_TITLE" `
            --identifier "$env:APP_IDENTIFIER" --icon "assets/icon.png" `
            --width 1280 --height 800 --app-version "$env:APP_VERSION" --targets arm64 `
            --inject "scripts/external-links.js,scripts/check-update.js,scripts/auth-token.js"
          if (Test-Path "$env:APP_NAME.msi") { Move-Item "$env:APP_NAME.msi" "dist/${env:APP_NAME}_arm64.msi" -Force }

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          ARGS=("$APP_URL" --name "$APP_NAME" --title "$APP_TITLE" \
                --identifier "$APP_IDENTIFIER" --icon assets/icon.png \
                --width 1280 --height 800 --app-version "$APP_VERSION" \
                --targets "$LINUX_TARGETS" --inject scripts/external-links.js,scripts/check-update.js,scripts/auth-token.js)
          npx --no-install pake "${ARGS[@]}"

      # ================= 收集产物到 dist/ =================
      # pake 成功后会把安装包从内置工程的 target 目录复制到工作区根目录，并清空 bundle 目录；
      # 所以根目录优先，target 只兜底搜索 release/bundle 下的安装包（绝不能全目录递归，
      # 否则会把 Rust 编译中间产物如 build_script_build-*.exe 一并收集）。
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # 1) 工作区根目录（pake 成功后的落点）
          cp -f ./*.dmg ./*.msi ./*.exe ./*.deb ./*.AppImage ./*.rpm dist/ 2>/dev/null || true
          # 2) 兜底：只找 target/**/release/bundle/ 下的安装包
          PK="node_modules/pake-cli/src-tauri/target"
          if [ -d "$PK" ]; then
            find "$PK" \( \
              -path "*release/bundle/dmg/*.dmg" \
              -o -path "*release/bundle/msi/*.msi" \
              -o -path "*release/bundle/nsis/*.exe" \
              -o -path "*release/bundle/deb/*.deb" \
              -o -path "*release/bundle/appimage/*.AppImage" \
              -o -path "*release/bundle/rpm/*.rpm" \
            \) -exec cp -f {} dist/ \; 2>/dev/null || true
          fi
          echo "---- dist/ ----"
          ls -la dist/ 2>/dev/null || true

      # ---- macOS 公证由 tauri-bundler 在上一步构建时原生完成（检测到 APPLE_* 环境变量即执行，
      #      无需单独步骤）----

      # ================= 上传：1) 构建产物（供 Actions 页面下载） 2) GitHub Release =================
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-${{ matrix.build }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

      # tag 触发时把安装包上传到 GitHub Release 的【草稿】，不自动 publish。
      # 你在 Releases 页确认无误后手动点 "Publish release" 上线。
      # 注意：draft release 不会被 GitHub API 的 releases/latest 返回，
      # 所以桌面壳的"检查更新"只会检测到已正式发布的版本。
      - name: Upload to GitHub Release (draft, not published)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: false